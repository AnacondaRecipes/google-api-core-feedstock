{% set name = "google-api-core" %}
{% set version = "2.34.0" %}

package:
  name: {{ name }}-split
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace("-", "_") }}-{{ version }}.tar.gz
  sha256: 98a779fe72de956eb1c9c2f47ff4c4432a668ece1a002ec38bed07ec2698ae59

build:
  number: 0
  skip: true  # [py<39]

outputs:
  - name: {{ name }}
    script: build_base.sh  # [unix]
    script: bld_base.bat  # [win]
    requirements:
      host:
        - python
        - setuptools
        - wheel
        - pip
      run:
        - python
        - googleapis-common-protos >=1.63.2,<2.0.0
        - protobuf >=5.29.6,<8.0.0
        - proto-plus >=1.24.0,<2.0.0
        - proto-plus >=1.25.0,<2.0.0  # [py>=313]
        - google-auth >=2.14.1,<3.0.0
        - requests >=2.33.0,<3.0.0
      run_constrained:
        # https://github.com/googleapis/google-cloud-python/blob/google-api-core-v2.33.0/packages/google-api-core/pyproject.toml#L66-L74
        - grpcio >=1.41.0,<2.0.0  # [py<311]
        - grpcio >=1.49.1,<2.0.0  # [py>=311 and py<314]
        - grpcio >=1.75.1,<2.0.0  # [py>=314]
        - grpcio-status >=1.41.0,<2.0.0  # [py<311]
        - grpcio-status >=1.49.1,<2.0.0  # [py>=311 and py<314]
        - grpcio-status >=1.75.1,<2.0.0  # [py>=314]
        # async_rest extra
        - google-auth >=2.14.1,<3.0.0
        - aiohttp >=3.13.4
    test:
      requires:
        - pip
      imports:
        - google.auth
        - google.auth.credentials
        - google.auth.transport.requests
        - google.longrunning
        - google.longrunning.operations_pb2
        - google.protobuf
        - google.rpc
        - google.api_core
        - google.api_core.exceptions
        - google.api_core.future
        - google.api_core.future.base
        - google.api_core.future.polling
        - google.api_core.general_helpers
        - google.api_core.page_iterator
        - google.api_core.protobuf_helpers
        - google.api_core.retry
        - google.api_core.timeout
      commands:
        - pip check
  - name: {{ name }}-grpc
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage(name, exact=True) }}
        - grpcio >=1.41.0,<2.0.0  # [py<311]
        - grpcio >=1.49.1,<2.0.0  # [py>=311 and py<314]
        - grpcio >=1.75.1,<2.0.0  # [py>=314]
        - grpcio-status >=1.41.0,<2.0.0  # [py<311]
        - grpcio-status >=1.49.1,<2.0.0  # [py>=311 and py<314]
        - grpcio-status >=1.75.1,<2.0.0  # [py>=314]
    test:
      requires:
        - pip
      imports:
        - google.api_core
      commands:
        - pip check
    about:
      home: https://github.com/googleapis/python-api-core
      license: Apache-2.0
      license_family: APACHE
      summary: Core Library for Google Client Libraries with grpc

about:
  home: https://github.com/googleapis/python-api-core
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Core Library for Google Client Libraries
  description: |
    Core Library for Google Client Libraries
    -------------------------
    This library is not meant to stand-alone. Instead it defines common helpers used by
    all Google API clients. For more information, see the documentation.
  doc_url: https://googleapis.dev/python/google-api-core/latest/index.html
  dev_url: https://github.com/googleapis/python-api-core

extra:
  skip-lints:
    - missing_python_build_tool
    - missing_wheel
  feedstock-name: google-api-core
  recipe-maintainers:
    - BrentDorsey
    - leahecole
    - parthea
    - tswast
